name: Verify Cloudflare profile worker
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/loox-profile-api.js"
      - "api/loox.js"
      - ".github/workflows/cloudflare-profile-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker module syntax
        run: node --check cloudflare/loox-profile-api.js
      - name: Verify deployed Cloudflare API health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-connrefused \
            'https://loox-profile-api.looxai-studio.workers.dev/v1/health' \
            | tee /tmp/loox-profile-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/loox-profile-health.json'));if(x.ok!==true||x.storage!=='cloudflare-d1-r2')process.exit(1)"
      - name: Verify public D1 discovery without exposing post contents
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 \
            'https://loox-profile-api.looxai-studio.workers.dev/v1/discover?kind=all&sort=latest&offset=0' \
            -o /tmp/loox-discover.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/loox-discover.json'));if(!Array.isArray(d.items)||typeof d.has_more!=='boolean')process.exit(1);console.log('Cloudflare community discovery: shape valid')"
      - name: Verify approved posts, R2 media and access controls
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://loox-profile-api.looxai-studio.workers.dev/v1';
          const json=async(u,opts)=>{const r=await fetch(base+u,opts);return {status:r.status,body:await r.json()};};
          const discovered=await json('/discover?kind=all&sort=latest&offset=0');
          assert.equal(discovered.status,200);
          assert.ok(Array.isArray(discovered.body.items));
          assert.ok(discovered.body.items.length>0,'Expected migrated public approved posts');
          const post=discovered.body.items[0];
          assert.equal(post.status,'approved');assert.equal(Boolean(post.visible),true);
          const detail=await json('/post?id='+encodeURIComponent(post.id));
          assert.equal(detail.status,200);assert.equal(detail.body.id,post.id);
          const media=await fetch(base+'/media?type=post&id='+encodeURIComponent(post.id)+'&variant=preview');
          assert.equal(media.status,200);
          assert.ok((media.headers.get('Content-Type')||'').startsWith('image/')||
                    (media.headers.get('Content-Type')||'').startsWith('video/'));
          await media.body?.cancel();
          const anonymousWrite=await json('/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          assert.equal(anonymousWrite.status,401);
          const forbidden=await json('/profile?id='+encodeURIComponent(post.creator_id),{headers:{Origin:'https://untrusted.example'}});
          assert.equal(forbidden.status,403);
          console.log('Cloudflare profile integration checks passed');
          JS
      - name: Audit public payload redaction, auth and security headers
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://loox-profile-api.looxai-studio.workers.dev/v1';
          const raw=async path=>fetch(base+path,{redirect:'error'});
          const feed=await raw('/discover?sort=latest');
          assert.equal(feed.status,200);
          const publicFeed=await feed.json();
          assert.ok(publicFeed.items.length>0);
          const post=publicFeed.items[0];
          const id=encodeURIComponent(post.id),creator=encodeURIComponent(post.creator_id);
          const forbiddenKeys=['job_id','media_key','thumbnail_key','avatar_key','avatar_thumbnail_key'];
          const detail=await raw('/post?id='+id);
          assert.equal(detail.status,200);
          const publicPost=await detail.json();
          for(const key of forbiddenKeys)assert.ok(!(key in publicPost),'Post leaked '+key);
          const timeline=await raw('/feed?tab=posts&creator_id='+creator);
          assert.equal(timeline.status,200);
          const items=(await timeline.json()).items;
          assert.ok(items.length>0);
          for(const item of items)for(const key of forbiddenKeys)assert.ok(!(key in item),'Timeline leaked '+key);
          const profile=await raw('/profile?id='+creator);
          assert.equal(profile.status,200);
          const user=await profile.json();
          for(const key of ['avatar_key','avatar_thumbnail_key'])assert.ok(!(key in user),'Profile leaked '+key);
          for(const [name,value] of [['x-content-type-options','nosniff'],['referrer-policy','no-referrer'],['x-frame-options','DENY']])
            assert.equal(profile.headers.get(name),value);
          const anonNotifications=await raw('/notifications');
          assert.equal(anonNotifications.status,401);
          const anonMutation=await fetch(base+'/follow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({creator_id:post.creator_id,follow:true})});
          assert.equal(anonMutation.status,401);
          const badOrigin=await fetch(base+'/discover',{headers:{Origin:'https://attacker.example'}});
          assert.equal(badOrigin.status,403);
          console.log('Security checks: response redaction, auth, CORS and headers passed');
          JS
      - name: Verify Vercel compatibility route delegates to Cloudflare
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://loox-profile-api.looxai-studio.workers.dev/v1';
          const d=await (await fetch(base+'/discover?sort=latest')).json();
          assert.ok(d.items?.length>0);
          const id=d.items[0].id;
          const endpoint='https://looxtoolfree-backend.vercel.app/api/loox?action=public_media&type=post&id='+encodeURIComponent(id);
          const response=await fetch(endpoint);
          assert.equal(response.status,200,'Vercel compatibility media endpoint unavailable');
          const body=await response.json();
          assert.ok(body.url.startsWith(base+'/media?type=post&id='),'Legacy endpoint did not delegate media to Cloudflare');
          const missing=await fetch('https://looxtoolfree-backend.vercel.app/api/loox?action=public_media&type=post&id=00000000-0000-4000-8000-000000000000');
          assert.equal(missing.status,404,'Missing post should not be publicly viewable');
          console.log('Legacy Vercel public media obeys Cloudflare post permissions');
          JS
      - name: Diagnose authenticated Worker request path and GitHub Pages CORS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://loox-profile-api.looxai-studio.workers.dev/v1';
          const origin='https://deadloxend-hash.github.io';
          const publicRes=await fetch(base+'/profile?id=2ffbb355-daec-4dc0-ad93-efb1aabdcc8c',{headers:{Origin:origin}});
          console.log('anonymous profile with GitHub Pages origin:',publicRes.status,await publicRes.clone().text());
          assert.equal(publicRes.status,200);
          assert.equal(publicRes.headers.get('access-control-allow-origin'),origin);
          const forged=await fetch(base+'/profile?id=2ffbb355-daec-4dc0-ad93-efb1aabdcc8c',{headers:{Origin:origin,Authorization:'Bearer '+('a'.repeat(90))}});
          console.log('invalid signed-in session response:',forged.status,await forged.text());
          assert.equal(forged.status,401,'Invalid bearer token must not cause an internal 503 error');
          JS
