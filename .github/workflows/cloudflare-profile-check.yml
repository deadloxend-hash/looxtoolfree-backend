name: Verify Cloudflare profile worker
on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/loox-profile-api.js"
      - ".github/workflows/cloudflare-profile-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker module syntax
        run: node --check cloudflare/loox-profile-api.js
      - name: Verify deployed Cloudflare API health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-connrefused \
            'https://loox-profile-api.looxai-studio.workers.dev/v1/health' \
            | tee /tmp/loox-profile-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/loox-profile-health.json'));if(x.ok!==true||x.storage!=='cloudflare-d1-r2')process.exit(1)"
      - name: Verify public D1 discovery without exposing post contents
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 \
            'https://loox-profile-api.looxai-studio.workers.dev/v1/discover?kind=all&sort=latest&offset=0' \
            -o /tmp/loox-discover.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/loox-discover.json'));if(!Array.isArray(d.items)||typeof d.has_more!=='boolean')process.exit(1);console.log('Cloudflare community discovery: shape valid')"
      - name: Verify approved posts, R2 media and access controls
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://loox-profile-api.looxai-studio.workers.dev/v1';
          const json=async(u,opts)=>{const r=await fetch(base+u,opts);return {status:r.status,body:await r.json()};};
          const discovered=await json('/discover?kind=all&sort=latest&offset=0');
          assert.equal(discovered.status,200);
          assert.ok(Array.isArray(discovered.body.items));
          assert.ok(discovered.body.items.length>0,'Expected migrated public approved posts');
          const post=discovered.body.items[0];
          assert.equal(post.status,'approved');assert.equal(Boolean(post.visible),true);
          const detail=await json('/post?id='+encodeURIComponent(post.id));
          assert.equal(detail.status,200);assert.equal(detail.body.id,post.id);
          const media=await fetch(base+'/media?type=post&id='+encodeURIComponent(post.id)+'&variant=preview');
          assert.equal(media.status,200);
          assert.ok((media.headers.get('Content-Type')||'').startsWith('image/')||
                    (media.headers.get('Content-Type')||'').startsWith('video/'));
          await media.body?.cancel();
          const anonymousWrite=await json('/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          assert.equal(anonymousWrite.status,401);
          const forbidden=await json('/profile?id='+encodeURIComponent(post.creator_id),{headers:{Origin:'https://untrusted.example'}});
          assert.equal(forbidden.status,403);
          console.log('Cloudflare profile integration checks passed');
          JS
