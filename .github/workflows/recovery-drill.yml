name: Isolated PostgreSQL recovery drill
on:
  workflow_dispatch:
  push:
    paths: ['src/recovery/**', 'scripts/database-backup.mjs', 'scripts/recovery-drill.mjs', '.github/workflows/recovery-drill.yml']
  pull_request:
    paths: ['src/recovery/**', 'scripts/database-backup.mjs', 'scripts/recovery-drill.mjs', '.github/workflows/recovery-drill.yml']
permissions:
  contents: read
jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-recovery-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Locate PostgreSQL clients
        run: |
          if ! command -v pg_dump >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          pg_dump --version
          pg_restore --version
      - name: Capture, encrypt and restore synthetic records with RLS
        env:
          PGPASSWORD: disposable-recovery-fixture-only
          LOOX_RECOVERY_DRILL: isolated-fixture
        run: node scripts/recovery-drill.mjs
