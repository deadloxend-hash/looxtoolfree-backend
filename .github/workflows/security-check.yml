name: LOOX security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - name: Secret-pattern scan (values redacted)
        run: node scripts/security-scan.mjs --history
      - name: Security and regression tests
        run: npm test
